# Live Sonnet 5 calls against the real API, billed to the wilson-evals
# Anthropic workspace. Two modes, chosen at dispatch time:
#
#   mode: sweep (default) — the Extractor fixture corpus (Issue #22),
#     `npm run eval:extraction`.
#   mode: cost — Issue #44's widened-vs-narrow per-turn cost proof,
#     `npm run cost:widened` (design.md's "Cost posture": a measured
#     cached-vs-uncached comparison against the pre-widening baseline).
#
# workflow_dispatch only, deliberately — no push or schedule trigger, for
# either mode. Matches the lesson recorded in lucy's own
# docs/SECRETS-AND-COSTS.md: a push-triggered eval workflow "fails
# nothing — it simply starts billing." The free, no-API-calls structural
# checks (`npm run eval:dry`, `npm run eval:narrative-dry`) already run on
# every PR via ci.yml; this is the separately-triggered, real-money job.
name: eval-extraction

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sweep (extraction fixture corpus) or cost (widened vs narrow per-turn cost comparison)"
        type: choice
        options:
          - sweep
          - cost
        default: sweep

jobs:
  eval:
    runs-on: ubuntu-latest
    # pull-requests: write is for the cost mode's self-recording step
    # below; contents: read is checkout. The sofa-claude App installation
    # holds no `actions` permission, so Claude cannot dispatch this
    # workflow or read its logs — a human clicks "Run workflow", and the
    # cost table records itself on the branch's PR so the run's result
    # lands where the acceptance criterion needs it without anyone
    # copying numbers out of a log.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run (${{ inputs.mode }})
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Explicit shell: GitHub only adds `set -o pipefail` when a step
        # names bash itself — its own default `run:` shell omits it, so
        # `npm run cost:widened | tee cost-output.txt`'s exit code was
        # always tee's (0) even when the script itself failed (reviewer
        # pass on PR #64). An over-ratio run is deliberately NOT an
        # exit-code failure: the script prints design.md's re-decision
        # warning and exits 0 — "roughly 2x" is Steve's soft threshold,
        # read from the posted table, not a hard gate here.
        shell: bash
        run: |
          if [ "${{ inputs.mode }}" = "cost" ]; then
            npm run cost:widened | tee cost-output.txt
          else
            npm run eval:extraction
          fi
      - name: Record cost table on the branch PR
        # always(): a FAILED cost run must still land its evidence on the
        # PR — Claude holds no `actions` permission and cannot read this
        # job's logs, so a skipped record step would make the failure
        # invisible to the merge process.
        if: ${{ always() && inputs.mode == 'cost' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh pr list --head "${GITHUB_REF_NAME}" --json number --jq '.[0].number' || true)
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No open PR for ${GITHUB_REF_NAME}; cost output stays in this log only."
            exit 0
          fi
          {
            echo "## Cost proof — widened vs narrow per-turn (mode=cost run ${GITHUB_RUN_ID})"
            echo
            if [ -s cost-output.txt ]; then
              echo '```'
              cat cost-output.txt
              echo '```'
            fi
            if [ "${{ job.status }}" != "success" ] || [ ! -s cost-output.txt ]; then
              echo
              echo "**The cost run did not complete successfully** (job status: ${{ job.status }}; table above may be empty or partial). Not a passing measurement — re-run after fixing the cause."
            fi
          } > cost-comment.md
          gh pr comment "$pr" --body-file cost-comment.md
